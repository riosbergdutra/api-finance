events {
    worker_connections 1024;
}

http {

    # ── Logging ────────────────────────────────────────────────────────────
    log_format main '$remote_addr - $request_time s '
                    '"$request" $status $body_bytes_sent';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # ── Upstream: Spring Boot ──────────────────────────────────────────────
    upstream finance_backend {
        server finance-app:8080;
        keepalive 32;
    }

    # ── Rate limiting ──────────────────────────────────────────────────────
    # Zona para endpoints de autenticação (mais restritiva)
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
    # Zona para API em geral
    limit_req_zone $binary_remote_addr zone=api:10m  rate=60r/m;

    server {
        listen 80;
        server_name localhost;

        # ── Segurança: headers ──────────────────────────────────────────────
        add_header X-Frame-Options         "DENY"            always;
        add_header X-Content-Type-Options  "nosniff"         always;
        add_header X-XSS-Protection        "1; mode=block"   always;
        add_header Referrer-Policy         "no-referrer"     always;

        # ── Auth: rate limit agressivo ──────────────────────────────────────
        location /auth/ {
            limit_req zone=auth burst=5 nodelay;
            limit_req_status 429;

            proxy_pass         http://finance_backend;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # ── API: rate limit padrão ──────────────────────────────────────────
        location /api/ {
            limit_req zone=api burst=20 nodelay;
            limit_req_status 429;

            proxy_pass         http://finance_backend;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # ── Actuator: apenas health exposto externamente ────────────────────
        # /actuator/prometheus fica acessível só internamente (via rede Docker)
        location /actuator/health {
            proxy_pass http://finance_backend;
        }

        location /actuator/ {
            # Bloqueia acesso externo a todos os outros endpoints do actuator
            deny all;
        }

        # ── Tudo mais → backend ─────────────────────────────────────────────
        location / {
            proxy_pass         http://finance_backend;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }
    }
}

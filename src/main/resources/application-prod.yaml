spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:default}
      password: ${REDIS_PASSWORD}
      ssl:
        enabled: true
  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: ${KEYCLOAK_CLIENT_ID}
            client-secret: ${KEYCLOAK_CLIENT_SECRET}
      provider:
        keycloak:
          issuer-uri: ${KEYCLOAK_ISSUER_URI}
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:${KEYCLOAK_ISSUER_URI}/protocol/openid-connect/certs}

stripe:
  api-key: ${STRIPE_API_KEY}
  price-id: ${STRIPE_PRICE_ID}
  frontend-url: ${FRONTEND_URL}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET}
  mode: test

app:
  keycloak:
    issuer-uri: ${KEYCLOAK_ISSUER_URI}
    backend-uri: ${KEYCLOAK_INTERNAL_URL:${KEYCLOAK_ISSUER_URI}}
    admin:
      base-url: ${KEYCLOAK_ADMIN_BASE_URL}
      realm: ${KEYCLOAK_REALM}
      client-id: ${KEYCLOAK_ADMIN_CLIENT_ID}
      client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET}
  security:
    jwt:
      required-audience: ${KEYCLOAK_API_AUDIENCE}
  frontend-url: ${FRONTEND_URL}
  auth:
    redirect-uri: ${AUTH_REDIRECT_URI}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  cookies:
    secure: true
    same-site: ${COOKIE_SAME_SITE:Lax}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

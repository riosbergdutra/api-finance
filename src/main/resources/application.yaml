spring:
  application:
    name: finance

  task:
    scheduling:
      pool:
        size: ${SCHEDULER_POOL_SIZE:3}
      thread-name-prefix: finance-scheduler-

  datasource:
    hikari:
      # Limite conservador por instância. Ajustável conforme capacidade do PostgreSQL.
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: 30000
      validation-timeout: 5000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false

  flyway:
    enabled: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:default}
      password: ${REDIS_PASSWORD:}
      connect-timeout: 2000ms
      timeout: 1000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 2
          max-wait: 500ms

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  cookies:
    secure: ${COOKIE_SECURE:true}
    same-site: ${COOKIE_SAME_SITE:Lax}

# ─── Resilience4j ──────────────────────────────────────────────────
resilience4j:
  circuitbreaker:
    instances:
      keycloak:
        # Abre o circuito após 50% de falhas em uma janela de 10 chamadas
        sliding-window-size: 10
        failure-rate-threshold: 50
        # Tempo em estado OPEN antes de tentar HALF_OPEN
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        # Exceções que NÃO contam como falha (ex: 401 é problema do cliente)
        ignore-exceptions:
          - org.springframework.security.access.AccessDeniedException
  retry:
    instances:
      keycloak:
        max-attempts: 3
        wait-duration: 500ms

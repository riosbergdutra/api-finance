spring:
  application:
    name: finance

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    # Com Virtual Threads, o gargalo é o pool de conexões.
    # pool_size = (núcleos * 2) + disco_spindle é um bom ponto de partida.
    properties:
      hibernate:
        connection:
          pool_size: 20

  flyway:
    enabled: false

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  cookies:
    secure: ${COOKIE_SECURE:true}
    same-site: ${COOKIE_SAME_SITE:Lax}

  data:
    redis:
      host: localhost
      port: 6379
      connect-timeout: 2000ms
      timeout: 1000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 2
          max-wait: 500ms

# ─── Resilience4j ──────────────────────────────────────────────────
resilience4j:
  circuitbreaker:
    instances:
      keycloak:
        # Abre o circuito após 50% de falhas em uma janela de 10 chamadas
        sliding-window-size: 10
        failure-rate-threshold: 50
        # Tempo em estado OPEN antes de tentar HALF_OPEN
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        # Exceções que NÃO contam como falha (ex: 401 é problema do cliente)
        ignore-exceptions:
          - org.springframework.security.access.AccessDeniedException
  retry:
    instances:
      keycloak:
        max-attempts: 3
        wait-duration: 500ms
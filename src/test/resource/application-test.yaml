# src/test/resources/application-test.yaml
#
# Perfil de testes de integração.
# O datasource é sobrescrito pelo @DynamicPropertySource em IntegrationTestBase.

spring:
  jpa:
    hibernate:
      ddl-auto: create-drop      # Cria o schema no início do teste e destrói no fim
    show-sql: false              # Reduz ruído no output dos testes
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: false               # Não usar Flyway nos testes ? ddl-auto cuida do schema

  data:
    redis:
      host: localhost
      port: 6379                 # Redis pode ser mockado ou usar outro Testcontainer se necessário

  security:
    oauth2:
      resourceserver:
        jwt:
          # URL do Keycloak ? use um valor qualquer nos testes que não validam JWT
          issuer-uri: http://localhost:8180/realms/financeflow

# Desabilita schedulers nos testes (evita jobs rodando durante os testes)
spring.task.scheduling.enabled: false
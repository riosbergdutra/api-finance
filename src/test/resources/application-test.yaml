spring:
  datasource:
    url: jdbc:h2:mem:financeflow;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: false
  data:
    redis:
      host: localhost
      port: 6379
  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: financeflow-test
            client-secret: test-secret
        provider:
          keycloak:
            issuer-uri: http://localhost:8180/realms/financeflow
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/financeflow

stripe:
  api-key: sk_test_ci_placeholder
  price-id: price_ci_placeholder
  frontend-url: http://localhost:4200
  webhook-secret: whsec_ci_placeholder
  mode: test

spring.task.scheduling.enabled: false

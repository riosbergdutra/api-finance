name: Backend CI

on:
  push:
    branches: [main, "hardening/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Make Maven wrapper executable
        run: chmod +x mvnw
      - name: Run tests and verification
        run: ./mvnw --batch-mode --no-transfer-progress verify
      - name: Validate Docker Compose configuration
        run: docker compose config --quiet
      - name: Validate Nginx configuration syntax
        run: |
          docker run --rm --add-host finance-app:127.0.0.1 \
            -v "$PWD/nginx/nginx.conf:/etc/nginx/nginx.conf:ro" \
            nginx:1.27-alpine nginx -t
      - name: Validate Prometheus configuration and alert rules
        run: |
          docker run --rm \
            -v "$PWD/prometheus:/etc/prometheus:ro" \
            --entrypoint promtool prom/prometheus:v2.52.0 \
            check config /etc/prometheus/prometheus.yml
          docker run --rm \
            -v "$PWD/prometheus:/etc/prometheus:ro" \
            --entrypoint promtool prom/prometheus:v2.52.0 \
            check rules /etc/prometheus/alerts.yml
      - name: Validate k6 load-test script syntax
        run: |
          docker run --rm \
            -v "$PWD/performance:/scripts:ro" \
            grafana/k6:0.54.0 inspect /scripts/k6/readiness.js
      - name: Validate operations shell scripts
        run: |
          for script in scripts/ops/*.sh; do
            bash -n "$script"
          done
      - name: Validate Alertmanager receiver secret guard
        run: |
          printf '%s' 'https://example.invalid/alertmanager-webhook' > /tmp/financeflow-alertmanager-webhook-url
          chmod 600 /tmp/financeflow-alertmanager-webhook-url
          ALERTMANAGER_WEBHOOK_URL_FILE=/tmp/financeflow-alertmanager-webhook-url \
            bash scripts/ops/validate-alertmanager-secret.sh
      - name: Validate Alertmanager receiver secret guard
        run: |
          printf '%s' 'https://example.invalid/alertmanager-webhook' > /tmp/financeflow-alertmanager-webhook-url
          chmod 600 /tmp/financeflow-alertmanager-webhook-url
          ALERTMANAGER_WEBHOOK_URL_FILE=/tmp/financeflow-alertmanager-webhook-url \
            bash scripts/ops/validate-alertmanager-secret.sh
      - name: Validate Alertmanager configuration and Compose overlay
        run: |
          printf '%s' 'https://example.invalid/alertmanager-webhook' > /tmp/financeflow-alertmanager-webhook-url
          chmod 600 /tmp/financeflow-alertmanager-webhook-url
          ALERTMANAGER_WEBHOOK_URL_FILE=/tmp/financeflow-alertmanager-webhook-url \
            docker compose -f compose.yaml -f compose.alertmanager.yaml config --quiet
          docker run --rm \
            -v "$PWD/ops/alertmanager:/etc/alertmanager:ro" \
            -v /tmp/financeflow-alertmanager-webhook-url:/run/secrets/alertmanager_webhook_url:ro \
            --entrypoint amtool prom/alertmanager:v0.28.1 \
            check-config /etc/alertmanager/alertmanager.yml
      - name: Validate production TLS Nginx example
        run: |
          mkdir -p /tmp/financeflow-tls
          openssl req -x509 -nodes -newkey rsa:2048 -days 1 \
            -keyout /tmp/financeflow-tls/tls_privkey.pem \
            -out /tmp/financeflow-tls/tls_fullchain.pem \
            -subj "/CN=finance.example.com"
          docker run --rm --add-host finance-app:127.0.0.1 \
            -v "$PWD/ops/production/nginx-tls.conf.example:/etc/nginx/nginx.conf:ro" \
            -v /tmp/financeflow-tls:/run/secrets:ro \
            nginx:1.27-alpine nginx -t
      - name: Build production container image
        run: docker build --pull --tag financeflow-backend:${{ github.sha }} .

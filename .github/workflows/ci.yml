name: Backend CI

on:
  push:
    branches: [main, "hardening/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Make Maven wrapper executable
        run: chmod +x mvnw
      - name: Run tests and verification
        run: ./mvnw --batch-mode --no-transfer-progress verify
      - name: Validate Docker Compose configuration
        run: docker compose config --quiet
      - name: Validate Nginx configuration syntax
        run: |
          docker run --rm --add-host finance-app:127.0.0.1 \
            -v "$PWD/nginx/nginx.conf:/etc/nginx/nginx.conf:ro" \
            nginx:1.27-alpine nginx -t
      - name: Validate Prometheus configuration and alert rules
        run: |
          docker run --rm \
            -v "$PWD/prometheus:/etc/prometheus:ro" \
            prom/prometheus:v2.52.0 \
            promtool check config /etc/prometheus/prometheus.yml
          docker run --rm \
            -v "$PWD/prometheus:/etc/prometheus:ro" \
            prom/prometheus:v2.52.0 \
            promtool check rules /etc/prometheus/alerts.yml
      - name: Validate k6 load-test script syntax
        run: |
          docker run --rm \
            -v "$PWD/performance:/scripts:ro" \
            grafana/k6:0.54.0 inspect /scripts/k6/readiness.js
      - name: Build production container image
        run: docker build --pull --tag financeflow-backend:${{ github.sha }} .

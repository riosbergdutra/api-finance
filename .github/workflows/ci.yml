name: Backend CI

on:
  push:
    branches: [main, "hardening/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Make Maven wrapper executable
        run: chmod +x mvnw
      - name: Run tests and verification
        run: ./mvnw --batch-mode --no-transfer-progress verify
      - name: Build production container image
        run: docker build --pull --tag financeflow-backend:${{ github.sha }} .
